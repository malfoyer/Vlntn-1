<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine for Lili</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Background -->
  <div class="bg" aria-hidden="true">
    <div class="bg__overlay"></div>
    <div class="bg__bloom"></div>
    <div class="bg__grain"></div>
  </div>

  <!-- Cupid Arrow (auto shoots) -->
  <div class="cupid" aria-hidden="true">
    <div class="cupid__arrow">➳</div>
    <div class="cupid__trail"></div>
  </div>

  <!-- Fireworks canvas -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Floating hearts -->
  <div id="floaties" aria-hidden="true"></div>

  <!-- Heart confetti -->
  <div id="confetti" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" id="card" aria-label="Valentine question">
      <header class="card__header">
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="tag">cringe tapi tulus</div>
      </header>

      <h1 class="headline">
        Lili,<br/>
        <span class="accent">Will you be my Valentine?</span>
      </h1>

      <p class="copy">
        Aku nggak jago gombal,<br/>
        tapi aku jago <span class="strong">sayang kamu</span> 💗
      </p>

      <div class="actions" id="actions">
        <button class="btn btn--yes" id="yesBtn" type="button"><span>YES 💖</span></button>
        <button class="btn btn--no" id="noBtn" type="button">No 😳</button>
      </div>

      <p class="micro" id="micro">(No itu cuma bercanda ya…)</p>
    </section>

    <section class="reveal" id="reveal" aria-hidden="true">
      <div class="reveal__top">
        <div class="pill">AAAA GEMES</div>
        <h2 class="reveal__title">YEAAYYYY 😭💞</h2>
        <p class="reveal__copy">
          Makasih ya Lili…<br/>
          aku seneng banget kamu bilang <span class="accent2">iya</span> 💗
        </p>
      </div>

      <div class="duckWrap">
        <img src="assets/duck-kiss.gif" class="duckGif" alt="Duck kiss" />
        <div class="duckCaption">ini kita versi bebek 😭💞</div>
      </div>

      <div class="reveal__actions">
        <button class="btn btn--ghost" id="resetBtn" type="button">Ulang dari awal 😭</button>
      </div>
    </section>

    <footer class="footer">
      <span>Kalau kamu senyum, aku ikut hidup.</span>
      <button class="musicBtn" id="musicBtn" type="button" aria-label="Toggle music">♫</button>
    </footer>
  </main>

  <!-- Music -->
  <audio id="bgm" src="assets/Lovee.mp3" preload="auto" loop></audio>

  <script src="script.js"></script>
</body>
</html>
